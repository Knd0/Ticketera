<div class="chatbot-container" [class.open]="isOpen">

    <!-- Trigger Button -->
    <button class="chat-trigger" (click)="toggleChat()" [attr.aria-label]="isOpen ? 'Cerrar ayuda' : 'Abrir ayuda'">
        <span *ngIf="!isOpen">💬</span>
        <span *ngIf="isOpen">✕</span>
        <div class="unread-badge" *ngIf="hasUnread && !isOpen"></div>
    </button>

    <!-- Chat Window -->
    <div class="chat-window" *ngIf="isOpen">
        <div class="chat-header">
            <div class="bot-info">
                <div class="bot-avatar">💬</div>
                <div>
                    <h3>Ayuda</h3>
                    <span class="status">Respuestas al instante</span>
                </div>
            </div>
        </div>

        <div class="chat-messages" #scrollContainer>
            <div class="message" *ngFor="let msg of messages" [class.user]="msg.sender === 'user'"
                [class.bot]="msg.sender === 'bot'">
                <div class="bubble">
                    {{ msg.text }}
                </div>
                <div class="timestamp">{{ msg.timestamp | date:'HH:mm' }}</div>

                <!-- Quick Actions -->
                <div class="actions" *ngIf="msg.actions">
                    <button *ngFor="let action of msg.actions" (click)="handleAction(action.value)" class="action-btn">
                        {{ action.label }}
                    </button>
                </div>
            </div>

            <div class="message bot" *ngIf="isTyping">
                <div class="bubble typing">
                    <span>.</span><span>.</span><span>.</span>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Escribí tu consulta o el nombre de un evento…" />
            <button (click)="sendMessage()" [disabled]="!userInput.trim()" aria-label="Enviar">➤</button>
        </div>
    </div>
</div>
