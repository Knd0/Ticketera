<div class="seat-map-container" *ngIf="!loading; else loader">
    <div class="screen">ESCENARIO</div>

    <div class="seats-grid">
        <div class="row" *ngFor="let row of rows">
            <div class="row-label">{{ row }}</div>
            <div class="seats-row">
                <ng-container *ngFor="let seat of seats">
                    <button *ngIf="seat.row === row" class="seat" [class.selected]="isSelected(seat)"
                        [class.sold]="seat.status === 'SOLD'" [disabled]="seat.status !== 'AVAILABLE'"
                        (click)="toggleSeat(seat)" [title]="'Fila ' + seat.row + ', butaca ' + seat.number">
                        {{ seat.number }}
                    </button>
                </ng-container>
            </div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="seat available"></span> Libre</div>
        <div class="legend-item"><span class="seat selected"></span> Elegida</div>
        <div class="legend-item"><span class="seat sold"></span> Ocupada</div>
    </div>
</div>

<ng-template #loader>
    <div class="loader">Cargando butacas…</div>
</ng-template>
