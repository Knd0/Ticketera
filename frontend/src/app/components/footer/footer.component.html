<footer class="footer">
    <div class="container footer-content">
        <div class="footer-center">
            <h3 class="footer-brand">{{ brand }}</h3>

            <nav class="footer-nav">
                <a routerLink="/">Eventos</a>
                <a routerLink="/terms">Términos</a>
                <a routerLink="/privacy">Privacidad</a>
                <a *ngIf="contactEmail" [href]="'mailto:' + contactEmail">Contacto</a>
                <a *ngIf="contactWhatsapp" [href]="'https://wa.me/' + contactWhatsapp" target="_blank" rel="noopener">WhatsApp</a>
                <button *ngIf="showInstallButton" (click)="installPwa()" class="install-btn">
                    📲 Instalar la app
                </button>
            </nav>

            <p class="copyright">&copy; {{ currentYear }} {{ brand }}</p>
        </div>
    </div>
</footer>
